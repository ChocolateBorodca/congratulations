<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>congratulations</title>
    <!-- Подключаем стильный футуристичный шрифт -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #06040a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Декоративные жидкие сферы на фоне для создания эффекта Glassmorphism */
        body::before, body::after {
            content: '';
            position: absolute;
            z-index: 1;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }
        body::before { width: 300px; height: 300px; top: 10%; left: 10%; }
        body::after { width: 400px; height: 400px; bottom: 15%; right: 5%; }

        /* Главный контейнер-заголовок СТРОГО в центре над фото */
        .header-container {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            margin-bottom: 35px;
            z-index: 10;
        }

        .main-title {
            font-size: clamp(2.5rem, 6vw, 5.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(180deg, #ffffff 0%, #a3a3a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Карточка товара в стиле Liquid Glass */
        .product-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            width: 100%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        /* Обертка изображения hoodie */
        .image-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            aspect-ratio: 1 / 1;
        }

        .hoodie-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: filter;
        }

        /* Негатив-эффект при наведении на десктопах */
        @media (hover: hover) {
            .image-wrapper:hover .hoodie-image {
                filter: invert(1);
            }
        }

        /* Класс негатива для мобильных устройств (переключается по клику) */
        .image-wrapper.is-negative .hoodie-image {
            filter: invert(1);
        }

        /* Блок с деталями товара */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .price-tag {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        /* Спецификации в стиле жидкого стекла */
        .specs-table {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 45px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 25px;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .spec-label {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
        }

        .spec-value {
            color: #ffffff;
            font-weight: 700;
            text-align: right;
        }

        /* Кнопка заказа с нативной премиальной анимацией сжатия Apple */
        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Эффект легкого глянца Apple при наведении */
        @media (hover: hover) {
            .telegram-btn:hover {
                background: rgba(255, 255, 255, 0.14);
                border-color: rgba(255, 255, 255, 0.3);
                box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
            }
        }

        /* Фирменный упругий клик в стиле интерфейсов Apple */
        .telegram-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.05);
            opacity: 0.85;
        }

        /* Адаптивность под мобильные экраны */
        @media (max-width: 768px) {
            body {
                padding: 25px 15px;
            }
            .product-card {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 20px;
            }
            .price-tag {
                margin-bottom: 25px;
                text-align: center;
            }
            .specs-table {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- Заголовок congratulations строго по центру над фото -->
    <div class="header-container">
        <h1 class="main-title">congratulations</h1>
    </div>

    <!-- Основная Liquid Glass карточка -->
    <main class="product-card">
        
        <!-- Интерактивная область с изображением hoodie -->
        <div class="image-wrapper" id="hoodieImageContainer">
            <!-- Путь СТРОГО соответствует вашему файлу в репозитории -->
            <img class="hoodie-image" src="images/hoodie.jpg" alt="hoodie">
        </div>

        <!-- Правая колонка с параметрами -->
        <div class="info-panel">
            <div class="price-tag">5 990 РУБ.</div>

            <div class="specs-table">
                <div class="spec-item">
                    <span class="spec-label">Состав:</span>
                    <span class="spec-value">Плотный хлопок 100%</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Печать:</span>
                    <span class="spec-value">Состаренный</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Размеры:</span>
                    <span class="spec-value">One Size (Oversized)</span>
                </div>
            </div>

            <!-- Кнопка со ссылкой на ваш Telegram и Apple-анимацией -->
            <a href="https://t.me" target="_blank" class="telegram-btn">
                Забрать в Telegram →
            </a>
        </div>

    </main>

    <!-- Скрипт для корректной обработки тапов (негатива) на телефонах -->
    <script>
        const imageContainer = document.getElementById('hoodieImageContainer');

        imageContainer.addEventListener('click', function(e) {
            // Переключаем класс инверсии для мобильных устройств по нажатию
            this.classList.toggle('is-negative');
        });
    </script>

</body>
</html>
