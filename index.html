<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>congratulations</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* Главный контейнер-заголовок по центру над фото */
        .header-container {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            margin-bottom: 40px;
        }

        .main-title {
            font-size: clamp(2.5rem, 7vw, 6rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
        }

        /* Контейнер контента без стеклянного фона и без закруглений */
        .product-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            width: 100%;
            max-width: 1100px;
            padding: 10px 0;
        }

        /* Обертка изображения hoodie без закруглений */
        .image-wrapper {
            position: relative;
            width: 100%;
            border: 1px solid #ffffff;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1 / 1;
        }

        .hoodie-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
            will-change: filter;
        }

        /* Негатив-эффект при наведении на десктопах */
        @media (hover: hover) {
            .image-wrapper:hover .hoodie-image {
                filter: invert(1);
            }
        }

        /* Класс негатива для мобильных устройств */
        .image-wrapper.is-negative .hoodie-image {
            filter: invert(1);
        }

        /* Блок с деталями товара */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .price-tag {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Спецификации в черно-белом стиле */
        .specs-table {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
            border-top: 1px solid #ffffff;
            padding-top: 25px;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .spec-label {
            color: #888888;
            font-weight: 700;
        }

        .spec-value {
            color: #ffffff;
            font-weight: 900;
            text-align: right;
        }

        /* Строгая прямоугольная кнопка с Apple-анимацией нажатия */
        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 22px;
            background-color: #ffffff;
            border: 1px solid #ffffff;
            color: #000000;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
        }

        /* Инверсия кнопки при наведении на десктопе */
        @media (hover: hover) {
            .telegram-btn:hover {
                background-color: #000000;
                color: #ffffff;
            }
        }

        /* Фирменный упругий клик Apple */
        .telegram-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        /* Адаптивность под мобильные экраны */
        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }
            .product-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .price-tag {
                text-align: left;
                margin-bottom: 20px;
            }
            .specs-table {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- Заголовок congratulations строго по центру и белый -->
    <div class="header-container">
        <h1 class="main-title">congratulations</h1>
    </div>

    <!-- Основной контейнер контента -->
    <main class="product-container">
        
        <!-- Область с изображением hoodie без закруглений -->
        <div class="image-wrapper" id="hoodieImageContainer">
            <img class="hoodie-image" src="images/hoodie.jpg" alt="hoodie">
        </div>

        <!-- Правая колонка с параметрами -->
        <div class="info-panel">
            <div>
                <div class="price-tag">5 990 РУБ.</div>

                <div class="specs-table">
                    <div class="spec-item">
                        <span class="spec-label">Состав:</span>
                        <span class="spec-value">Плотный хлопок 100%</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Печать:</span>
                        <span class="spec-value">Состаренный</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Размеры:</span>
                        <span class="spec-value">One Size (Oversized)</span>
                    </div>
                </div>
            </div>

            <!-- Прямая рабочая ссылка на ваш Telegram-аккаунт -->
            <a href="https://t.me/chocolateborodca" target="_blank" class="telegram-btn">
                Забрать в Telegram →
            </a>
        </div>

    </main>

    <!-- Скрипт для инверсии (негатива) на телефонах при тапе -->
    <script>
        const imageContainer = document.getElementById('hoodieImageContainer');

        imageContainer.addEventListener('click', function() {
            this.classList.toggle('is-negative');
        });
    </script>

</body>
</html>
